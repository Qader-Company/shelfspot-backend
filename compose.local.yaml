services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: shelfspot-app:local
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: shelfspot-app:local
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: shelfspot-app:local
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    image: shelfspot-app:local
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html
    ports:
      - "8080:8080"

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx
    image: shelfspot-nginx:local
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    ports:
      - "3307:3306"

  redis:
    ports:
      - "6380:6379"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shelfspot

  node:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
