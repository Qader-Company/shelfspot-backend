name: ShelfSpot CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================================
  # 1. Laravel Tests
  # ==========================================================

  tests:
    name: Laravel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_sqlite, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: composer test


  # ==========================================================
  # 2. Frontend Build
  # ==========================================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ==========================================================
  # 3. Docker Build + Verify + GHCR Push
  # ==========================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - tests
      - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # Laravel / PHP image
      # ------------------------------------------------------

      - name: Build Laravel image
        run: |
          docker build \
            --target app \
            -t shelfspot-app:ci \
            -f docker/php/Dockerfile .

      - name: Verify Laravel image
        run: |
          docker run --rm shelfspot-app:ci \
            sh -c 'test -f artisan && \
                   test -f vendor/autoload.php && \
                   test -f public/build/manifest.json && \
                   echo "APP IMAGE OK"'

      # ------------------------------------------------------
      # Nginx image
      # ------------------------------------------------------

      - name: Build Nginx image
        run: |
          docker build \
            --target nginx \
            -t shelfspot-nginx:ci \
            -f docker/php/Dockerfile .

      - name: Verify Nginx image
        run: |
          docker run --rm shelfspot-nginx:ci \
            sh -c 'test -f /var/www/html/public/index.php && \
                   test -f /var/www/html/public/build/manifest.json && \
                   echo "NGINX IMAGE OK"'

      # ------------------------------------------------------
      # Tag images
      # ------------------------------------------------------

      - name: Tag Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker tag shelfspot-app:ci \
            ghcr.io/qader-company/shelfspot-backend-app:${{ github.sha }}

          docker tag shelfspot-app:ci \
            ghcr.io/qader-company/shelfspot-backend-app:develop

          docker tag shelfspot-nginx:ci \
            ghcr.io/qader-company/shelfspot-backend-nginx:${{ github.sha }}

          docker tag shelfspot-nginx:ci \
            ghcr.io/qader-company/shelfspot-backend-nginx:develop

      # ------------------------------------------------------
      # Push images
      # ------------------------------------------------------

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker push \
            ghcr.io/qader-company/shelfspot-backend-app:${{ github.sha }}

          docker push \
            ghcr.io/qader-company/shelfspot-backend-app:develop

          docker push \
            ghcr.io/qader-company/shelfspot-backend-nginx:${{ github.sha }}

          docker push \
            ghcr.io/qader-company/shelfspot-backend-nginx:develop


  # ==========================================================
  # 4. Test GitHub Actions -> Testing VPS connection
  # ==========================================================

  test-vps-connection:
    name: Test VPS Connection
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment: testing

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TESTING_SSH_KEY }}
          SSH_HOST: ${{ secrets.TESTING_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/testing_key
          chmod 600 ~/.ssh/testing_key

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.TESTING_HOST }}
          SSH_USER: ${{ secrets.TESTING_USER }}
        run: |
          ssh \
            -i ~/.ssh/testing_key \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            '
              set -e

              echo "===== USER ====="
              whoami

              echo "===== HOST ====="
              hostname

              echo "===== DOCKER ====="
              docker --version

              echo "===== DOCKER COMPOSE ====="
              docker compose version

              echo "===== PROJECT ====="
              cd /opt/shelfspot/testing
              pwd

              echo "===== DONE ====="
              echo "SSH connection successful"
            '
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TESTING_SSH_KEY }}
          SSH_HOST: ${{ secrets.TESTING_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/testing_key
          chmod 600 ~/.ssh/testing_key

          echo "===== CHECK SECRET ====="
          test -n "$SSH_HOST" && echo "SSH_HOST exists"
          test -n "$SSH_PRIVATE_KEY" && echo "SSH_PRIVATE_KEY exists"

          echo "===== CHECK PRIVATE KEY ====="
          ssh-keygen -y -f ~/.ssh/testing_key > /dev/null
          echo "Private key is valid"

          echo "===== CHECK SSH PORT ====="
          nc -vz -w 10 "$SSH_HOST" 22

          echo "===== SCAN HOST KEY ====="
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration successful"
