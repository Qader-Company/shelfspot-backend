name: Test Testing Deployment Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    name: Test VPS Connection
    runs-on: ubuntu-latest

    environment: testing

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TESTING_SSH_KEY }}
          SSH_HOST: ${{ secrets.TESTING_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/testing_key
          chmod 600 ~/.ssh/testing_key

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.TESTING_HOST }}
          SSH_USER: ${{ secrets.TESTING_USER }}
        run: |
          ssh \
            -i ~/.ssh/testing_key \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            '
              set -e

              echo "===== USER ====="
              whoami

              echo "===== HOST ====="
              hostname

              echo "===== DOCKER ====="
              docker --version

              echo "===== DOCKER COMPOSE ====="
              docker compose version

              echo "===== PROJECT ====="
              cd /opt/shelfspot/testing
              pwd

              echo "===== DONE ====="
              echo "SSH connection successful"
            '
