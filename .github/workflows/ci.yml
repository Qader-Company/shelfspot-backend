name: ShelfSpot CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================================
  # 1. Laravel Tests
  # ==========================================================

  tests:
    name: Laravel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_sqlite, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: composer test


  # ==========================================================
  # 2. Frontend Build
  # ==========================================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ==========================================================
  # 3. Docker Build + Verify + GHCR Push
  # ==========================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - tests
      - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # Laravel / PHP image
      # ------------------------------------------------------

      - name: Build Laravel image
        run: |
          docker build \
            --target app \
            -t shelfspot-app:ci \
            -f docker/php/Dockerfile .

      - name: Verify Laravel image
        run: |
          docker run --rm shelfspot-app:ci \
            sh -c 'test -f artisan && \
                   test -f vendor/autoload.php && \
                   test -f public/build/manifest.json && \
                   echo "APP IMAGE OK"'

      # ------------------------------------------------------
      # Nginx image
      # ------------------------------------------------------

      - name: Build Nginx image
        run: |
          docker build \
            --target nginx \
            -t shelfspot-nginx:ci \
            -f docker/php/Dockerfile .

      - name: Verify Nginx image
        run: |
          docker run --rm shelfspot-nginx:ci \
            sh -c 'test -f /var/www/html/public/index.php && \
                   test -f /var/www/html/public/build/manifest.json && \
                   echo "NGINX IMAGE OK"'

      # ------------------------------------------------------
      # Tag images
      # ------------------------------------------------------

      - name: Tag Docker images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          docker tag shelfspot-app:ci \
            ghcr.io/qader-company/shelfspot-backend-app:${{ github.sha }}

          docker tag shelfspot-app:ci \
            ghcr.io/qader-company/shelfspot-backend-app:develop

          docker tag shelfspot-nginx:ci \
            ghcr.io/qader-company/shelfspot-backend-nginx:${{ github.sha }}

          docker tag shelfspot-nginx:ci \
            ghcr.io/qader-company/shelfspot-backend-nginx:develop

      # ------------------------------------------------------
      # Push images
      # ------------------------------------------------------

      - name: Tag Docker images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          BRANCH_TAG="${GITHUB_REF_NAME}"

          echo "Branch tag: $BRANCH_TAG"

          docker tag shelfspot-app:ci \
            ghcr.io/qader-company/shelfspot-backend-app:${{ github.sha }}

          docker tag shelfspot-app:ci \
            ghcr.io/qader-company/shelfspot-backend-app:$BRANCH_TAG

          docker tag shelfspot-nginx:ci \
            ghcr.io/qader-company/shelfspot-backend-nginx:${{ github.sha }}

          docker tag shelfspot-nginx:ci \
            ghcr.io/qader-company/shelfspot-backend-nginx:$BRANCH_TAG

          echo "===== LOCAL TAGS ====="
          docker images | grep shelfspot-backend

      - name: Push Docker images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          BRANCH_TAG="${GITHUB_REF_NAME}"

          docker push \
            ghcr.io/qader-company/shelfspot-backend-app:${{ github.sha }}

          docker push \
            ghcr.io/qader-company/shelfspot-backend-app:$BRANCH_TAG

          docker push \
            ghcr.io/qader-company/shelfspot-backend-nginx:${{ github.sha }}

          docker push \
            ghcr.io/qader-company/shelfspot-backend-nginx:$BRANCH_TAG
  # ==========================================================
  # 4. Deploy Testing
  # ==========================================================

  deploy-testing:
    name: Deploy Testing
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment: testing

    concurrency:
      group: shelfspot-testing
      cancel-in-progress: false

    steps:

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TESTING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TESTING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/testing_key
          chmod 600 ~/.ssh/testing_key

          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/testing_key > /dev/null

          echo "SSH configuration OK"

      - name: Deploy to Testing VPS
        env:
          SSH_HOST: ${{ secrets.TESTING_HOST }}
          SSH_USER: ${{ secrets.TESTING_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/testing_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=150 \
            "$SSH_USER@$SSH_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'

              set -euo pipefail

              cd /opt/shelfspot/testing

              COMPOSE="docker compose \
                -p shelfspot-testing \
                -f compose.yaml \
                -f compose.testing.yaml"

              echo "===== CURRENT DEPLOYMENT ====="

              CURRENT_APP_IMAGE=$(docker inspect shelfspot-testing-app-1 \
                --format '{{.Config.Image}}' 2>/dev/null || true)

              CURRENT_TAG=""

              if [ -n "$CURRENT_APP_IMAGE" ]; then
                CURRENT_TAG="${CURRENT_APP_IMAGE##*:}"
              fi

              echo "Current image: ${CURRENT_APP_IMAGE:-none}"
              echo "Current tag:   ${CURRENT_TAG:-none}"
              echo "New tag:       $IMAGE_TAG"

              echo "===== UPDATE DEPLOYMENT CONFIG ====="

              git fetch origin
              git checkout develop
              git pull --ff-only origin develop

              echo "===== PULL NEW IMAGES ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE pull

              echo "===== RUN MIGRATIONS ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE run --rm -T app \
                php artisan migrate --force </dev/null

              echo "===== START NEW VERSION ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE up -d --remove-orphans

              echo "===== CLEAR CACHE ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE exec -T app \
                php artisan optimize:clear

              echo "===== VERIFY DEPLOYED IMAGE ====="

              EXPECTED_APP_IMAGE="ghcr.io/qader-company/shelfspot-backend-app:$IMAGE_TAG"
              EXPECTED_NGINX_IMAGE="ghcr.io/qader-company/shelfspot-backend-nginx:$IMAGE_TAG"

              ACTUAL_APP_IMAGE=$(docker inspect shelfspot-testing-app-1 \
                --format '{{.Config.Image}}')

              ACTUAL_NGINX_IMAGE=$(docker inspect shelfspot-testing-nginx-1 \
                --format '{{.Config.Image}}')

              echo "Expected app:   $EXPECTED_APP_IMAGE"
              echo "Running app:    $ACTUAL_APP_IMAGE"

              echo "Expected nginx: $EXPECTED_NGINX_IMAGE"
              echo "Running nginx:  $ACTUAL_NGINX_IMAGE"

              test "$ACTUAL_APP_IMAGE" = "$EXPECTED_APP_IMAGE"
              test "$ACTUAL_NGINX_IMAGE" = "$EXPECTED_NGINX_IMAGE"

              echo "===== HEALTH CHECK ====="

              HEALTHY=false

              for i in 1 2 3 4 5 6; do
                if curl --fail --silent --show-error \
                  https://testing.api.shelfspots.com/ > /dev/null; then

                  HEALTHY=true
                  break
                fi

                echo "Health check attempt $i failed"
                sleep 5
              done

              if [ "$HEALTHY" = true ]; then
                echo "Testing deployment healthy"
              else
                echo "===== DEPLOYMENT FAILED ====="

                if [ -z "$CURRENT_TAG" ]; then
                  echo "No previous deployment found. Cannot rollback."
                  exit 1
                fi

                echo "Rolling back to: $CURRENT_TAG"

                IMAGE_TAG="$CURRENT_TAG" $COMPOSE pull

                IMAGE_TAG="$CURRENT_TAG" $COMPOSE up -d --remove-orphans

                IMAGE_TAG="$CURRENT_TAG" $COMPOSE exec -T app \
                  php artisan optimize:clear

                echo "===== VERIFY ROLLBACK ====="

                ROLLED_BACK_IMAGE=$(docker inspect shelfspot-testing-app-1 \
                  --format '{{.Config.Image}}')

                echo "Running image: $ROLLED_BACK_IMAGE"

                if curl --fail --silent --show-error \
                  https://testing.api.shelfspots.com/ > /dev/null; then
                  echo "Rollback successful"
                else
                  echo "Rollback completed but health check still fails"
                fi

                exit 1
              fi

              echo "===== CONTAINERS ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE ps

              echo "===== CLEAN UNUSED IMAGES ====="

              docker image prune -f

              echo "===== DEPLOYMENT COMPLETE ====="

          REMOTE

  # ==========================================================
  # 5. Deploy Production
  # ==========================================================

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    concurrency:
      group: shelfspot-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key

          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/production_key > /dev/null

          echo "SSH configuration OK"

      - name: Deploy to Production VPS
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for attempt in 1 2; do
            echo "===== SSH DEPLOY ATTEMPT $attempt/2 ====="

            if ssh \
              -i ~/.ssh/production_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=60 \
              "$SSH_USER@$SSH_HOST" \
              "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'

              set -euo pipefail

              cd /opt/shelfspot/production

              COMPOSE="docker compose \
                -p shelfspot-production \
                -f compose.yaml \
                -f compose.production.yaml"

              echo "===== CURRENT DEPLOYMENT ====="

              CURRENT_APP_IMAGE=$(docker inspect shelfspot-production-app-1 \
                --format '{{.Config.Image}}' 2>/dev/null || true)

              CURRENT_TAG=""

              if [ -n "$CURRENT_APP_IMAGE" ]; then
                CURRENT_TAG="${CURRENT_APP_IMAGE##*:}"
              fi

              echo "Current image: ${CURRENT_APP_IMAGE:-none}"
              echo "Current tag:   ${CURRENT_TAG:-none}"
              echo "New tag:       $IMAGE_TAG"

              echo "===== UPDATE DEPLOYMENT CONFIG ====="

              git fetch origin
              git checkout main
              git pull --ff-only origin main

              echo "===== PULL NEW IMAGES ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE pull

              echo "===== RUN MIGRATIONS ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE run --rm -T app \
                php artisan migrate --force </dev/null

              echo "===== START NEW VERSION ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE up -d --remove-orphans

              echo "===== CLEAR CACHE ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE exec -T app \
                php artisan optimize:clear

              echo "===== VERIFY DEPLOYED IMAGE ====="

              EXPECTED_APP_IMAGE="ghcr.io/qader-company/shelfspot-backend-app:$IMAGE_TAG"
              EXPECTED_NGINX_IMAGE="ghcr.io/qader-company/shelfspot-backend-nginx:$IMAGE_TAG"

              ACTUAL_APP_IMAGE=$(docker inspect shelfspot-production-app-1 \
                --format '{{.Config.Image}}')

              ACTUAL_NGINX_IMAGE=$(docker inspect shelfspot-production-nginx-1 \
                --format '{{.Config.Image}}')

              echo "Expected app:   $EXPECTED_APP_IMAGE"
              echo "Running app:    $ACTUAL_APP_IMAGE"

              echo "Expected nginx: $EXPECTED_NGINX_IMAGE"
              echo "Running nginx:  $ACTUAL_NGINX_IMAGE"

              test "$ACTUAL_APP_IMAGE" = "$EXPECTED_APP_IMAGE"
              test "$ACTUAL_NGINX_IMAGE" = "$EXPECTED_NGINX_IMAGE"

              echo "===== HEALTH CHECK ====="

              HEALTHY=false

              for i in 1 2 3 4 5 6; do
                if curl --fail --silent --show-error \
                  https://api.shelfspots.com/ > /dev/null; then

                  HEALTHY=true
                  break
                fi

                echo "Health check attempt $i failed"
                sleep 5
              done

              if [ "$HEALTHY" = true ]; then
                echo "Production deployment healthy"
              else
                echo "===== DEPLOYMENT FAILED ====="

                if [ -z "$CURRENT_TAG" ]; then
                  echo "No previous deployment found. Cannot rollback."
                  exit 1
                fi

                echo "Rolling back to: $CURRENT_TAG"

                IMAGE_TAG="$CURRENT_TAG" $COMPOSE pull

                IMAGE_TAG="$CURRENT_TAG" $COMPOSE up -d --remove-orphans

                IMAGE_TAG="$CURRENT_TAG" $COMPOSE exec -T app \
                  php artisan optimize:clear

                echo "===== VERIFY ROLLBACK ====="

                ROLLED_BACK_IMAGE=$(docker inspect shelfspot-production-app-1 \
                  --format '{{.Config.Image}}')

                echo "Running image after rollback: $ROLLED_BACK_IMAGE"

                if curl --fail --silent --show-error \
                  https://api.shelfspots.com/ > /dev/null; then
                  echo "Rollback successful"
                else
                  echo "Rollback completed but health check still fails"
                fi

                exit 1
              fi

              echo "===== CONTAINERS ====="

              IMAGE_TAG="$IMAGE_TAG" $COMPOSE ps

              echo "===== CLEAN UNUSED IMAGES ====="

              docker image prune -f

              echo "===== DEPLOYMENT COMPLETE ====="

            REMOTE
            then
            echo "SSH deployment succeeded on attempt $attempt"
            exit 0
            fi

            echo "SSH deployment attempt $attempt failed"

            if [ "$attempt" -lt 2 ]; then
            echo "Waiting 20 seconds before retry..."
            sleep 20
            fi
            done

            echo "SSH deployment failed after 2 attempts"
            exit 1
