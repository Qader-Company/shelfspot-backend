x-laravel-service: &laravel-service
    image: "${APP_IMAGE}"
    working_dir: /var/www/html

    env_file:
        - .env

    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_started
    networks:
        - shelfspot
    restart: unless-stopped

services:
    app:
        <<: *laravel-service
        command: php-fpm

    queue:
        <<: *laravel-service
        command: php artisan queue:work

    scheduler:
        <<: *laravel-service
        command: php artisan schedule:work

    reverb:
        <<: *laravel-service
        command: php artisan reverb:start --host=0.0.0.0 --port=8080

    nginx:
        image: "${NGINX_IMAGE}"
        restart: unless-stopped
        depends_on:
            - app
        networks:
            - shelfspot

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
              ]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - shelfspot

    redis:
        image: redis:alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - shelfspot

networks:
    shelfspot:
        driver: bridge

volumes:
    mysql_data:
    redis_data:
